<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join me on The Relationship Bible</title>
<meta name="description" content="Do a plan together, each at your own pace.">
<meta property="og:title" content="Join me on The Relationship Bible">
<meta property="og:description" content="Do a plan together, each at your own pace.">
<meta property="og:image" content="https://therelationshipbible.app/og.png">
<meta property="og:url" content="https://therelationshipbible.app/join/">
<meta property="og:type" content="website">
<style>
  :root { --screen: #F7F7F3; --ink: #1E2722; --muted: #4F5A52; --pine: #285C4D; --line: rgba(30,39,34,.18); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--screen); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.25; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  a.btn { display: block; padding: 14px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .pri { background: var(--pine); color: #fff; }
  .sec { border: 1px solid var(--line); color: var(--ink); background: #fff; }
</style>
</head>
<body>
<main>
  <h1>Opening The Relationship Bible</h1>
  <p id="lead">If nothing happens, choose below.</p>
  <a class="btn pri" id="open" href="#">Open in the app</a>
  <a class="btn sec" id="play" href="https://play.google.com/store/apps/details?id=com.relationshipbible.app">Get it on Google Play</a>
  <a class="btn sec" id="appstore" href="https://apps.apple.com/app/id6800895681">Get it on the App Store</a>
  <p>New to the app? Once it's installed, tap your invite link again.</p>
</main>
<script>
  // Sends someone who tapped a plan invite to the app, or to the right store.
  // With the app installed and its link check passed, the phone opens the app
  // directly and this page never loads. Google Play passes `referrer` to the
  // app on its first launch, which is how an Android invite survives the
  // install. The App Store has no equivalent, hence the tap-again line.
  (function () {
    var token = new URLSearchParams(location.search).get('t') || '';
    if (!/^[0-9a-f]{16}$/i.test(token)) token = '';

    var ua = navigator.userAgent;
    var isAndroid = /Android/i.test(ua);
    var isIos = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    var play = 'https://play.google.com/store/apps/details?id=com.relationshipbible.app' +
      (token ? '&referrer=' + encodeURIComponent('plan_invite=' + token) : '');
    var appStore = 'https://apps.apple.com/app/id6800895681';
    var appLink = 'relationshipbible://join/' + token;

    document.getElementById('play').href = play;
    var open = document.getElementById('open');
    if (!token) open.style.display = 'none';

    if (isAndroid) {
      // Opens the app if it is installed, otherwise Google Play with the invite.
      var intent = 'intent://join/' + token + '#Intent;scheme=relationshipbible;package=com.relationshipbible.app;' +
        'S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
      open.href = token ? intent : play;
      document.getElementById('appstore').style.display = 'none';
      location.replace(token ? intent : play);
    } else if (isIos) {
      open.href = appLink;
      document.getElementById('play').style.display = 'none';
      location.replace(appStore);
    } else {
      document.getElementById('lead').textContent = 'Open this link on your phone to join the plan.';
      open.style.display = 'none';
    }
  })();
</script>
</body>
</html>
